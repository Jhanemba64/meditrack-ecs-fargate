# Mises à jour proposées chaque mois, regroupées par écosystème.
# Les correctifs de sécurité sont proposés dès leur publication (alertes Dependabot).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /api-backend
    schedule:
      interval: monthly
    ignore:
      # Montées de version majeures : décision manuelle (changements cassants)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /api-backend
    schedule:
      interval: monthly
    ignore:
      # Montées de version majeures : décision manuelle (changements cassants)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: monthly
    ignore:
      # Montées de version majeures : décision manuelle (changements cassants)
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
